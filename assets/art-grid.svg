<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="Abstract chat interface artwork in dark mode">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080b14"/>
      <stop offset="1" stop-color="#0d1424"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#38d6ff"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="26"/></filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="640" height="400" fill="url(#bg)"/>
  <rect width="640" height="400" fill="url(#grid)"/>
  <ellipse cx="320" cy="120" rx="300" ry="170" fill="url(#glow)" filter="url(#soft)"/>

  <!-- app frame -->
  <g transform="translate(64 44)">
    <rect width="512" height="312" rx="18" fill="#0b0e18" stroke="#1e2434"/>
    <!-- rail -->
    <rect x="0" y="0" width="56" height="312" rx="18" fill="#080a12"/>
    <rect x="14" y="16" width="28" height="28" rx="9" fill="url(#accent)"/>
    <rect x="14" y="56" width="28" height="28" rx="9" fill="#171c2b"/>
    <rect x="14" y="94" width="28" height="28" rx="9" fill="#171c2b"/>
    <rect x="14" y="132" width="28" height="28" rx="9" fill="#171c2b"/>
    <rect x="14" y="270" width="28" height="28" rx="9" fill="#171c2b"/>
    <!-- channel sidebar -->
    <rect x="56" y="0" width="140" height="312" fill="#0b0e18"/>
    <rect x="72" y="20" width="86" height="9" rx="4.5" fill="#e9ecf6" opacity="0.8"/>
    <rect x="72" y="40" width="52" height="6" rx="3" fill="#6b7391" opacity="0.7"/>
    <g fill="#9aa3bd" opacity="0.62">
      <rect x="72" y="72" width="72" height="7" rx="3.5"/>
      <rect x="72" y="96" width="60" height="7" rx="3.5"/>
      <rect x="72" y="120" width="80" height="7" rx="3.5"/>
      <rect x="72" y="144" width="54" height="7" rx="3.5"/>
      <rect x="72" y="168" width="68" height="7" rx="3.5"/>
    </g>
    <rect x="68" y="92" width="120" height="20" rx="7" fill="url(#accent)" opacity="0.18"/>
    <rect x="64" y="276" width="124" height="26" rx="9" fill="#11141f"/>
    <circle cx="80" cy="289" r="8" fill="url(#accent)"/>
    <rect x="94" y="284" width="52" height="6" rx="3" fill="#e9ecf6" opacity="0.75"/>
    <rect x="94" y="294" width="36" height="5" rx="2.5" fill="#6b7391"/>

    <!-- messages -->
    <g>
      <!-- message 1 -->
      <circle cx="214" cy="42" r="12" fill="url(#accent)"/>
      <rect x="234" y="34" width="58" height="7" rx="3.5" fill="#e9ecf6" opacity="0.85"/>
      <rect x="234" y="48" width="196" height="6" rx="3" fill="#9aa3bd" opacity="0.55"/>
      <rect x="234" y="61" width="156" height="6" rx="3" fill="#9aa3bd" opacity="0.45"/>
      <rect x="234" y="78" width="42" height="16" rx="8" fill="#171c2b"/>
      <rect x="281" y="78" width="38" height="16" rx="8" fill="#171c2b"/>
      <!-- message 2 -->
      <circle cx="214" cy="126" r="12" fill="#fb7185"/>
      <rect x="234" y="118" width="46" height="7" rx="3.5" fill="#e9ecf6" opacity="0.85"/>
      <rect x="234" y="132" width="222" height="6" rx="3" fill="#9aa3bd" opacity="0.55"/>
      <rect x="234" y="150" width="212" height="74" rx="10" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.07"/>
      <rect x="248" y="164" width="70" height="6" rx="3" fill="url(#accent)" opacity="0.9"/>
      <rect x="248" y="178" width="170" height="5" rx="2.5" fill="#9aa3bd" opacity="0.5"/>
      <rect x="248" y="190" width="140" height="5" rx="2.5" fill="#9aa3bd" opacity="0.4"/>
      <rect x="248" y="204" width="52" height="14" rx="7" fill="#7c5cff" opacity="0.35"/>
      <!-- message 3 -->
      <circle cx="214" cy="248" r="12" fill="#34d399"/>
      <rect x="234" y="240" width="52" height="7" rx="3.5" fill="#e9ecf6" opacity="0.85"/>
      <rect x="234" y="254" width="184" height="6" rx="3" fill="#9aa3bd" opacity="0.55"/>
      <!-- composer -->
      <rect x="206" y="268" width="284" height="32" rx="12" fill="#11141f" stroke="#1e2434"/>
      <rect x="220" y="280" width="120" height="6" rx="3" fill="#6b7391" opacity="0.7"/>
      <rect x="440" y="276" width="40" height="16" rx="8" fill="url(#accent)"/>
    </g>

    <!-- member list -->
    <rect x="504" y="0" width="8" height="0" fill="none"/>
  </g>

  <!-- floating chips -->
  <g transform="translate(496 20)">
    <rect width="112" height="26" rx="13" fill="#11141f" stroke="#1e2434"/>
    <circle cx="14" cy="13" r="4" fill="#3ddc97"/>
    <text x="26" y="17" font-family="Inter, Helvetica, Arial, sans-serif" font-size="9" fill="#9aa3bd" letter-spacing="0.6">6 ONLINE</text>
  </g>
  <g transform="translate(28 330)">
    <rect width="128" height="28" rx="14" fill="#11141f" stroke="#1e2434"/>
    <text x="14" y="18" font-family="Inter, Helvetica, Arial, sans-serif" font-size="9.5" fill="#9aa3bd" letter-spacing="0.8">NO NITRO NEEDED</text>
  </g>
</svg>
