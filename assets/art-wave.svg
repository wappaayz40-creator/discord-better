<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="Waveform artwork representing voice rooms">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#04120f"/>
      <stop offset="1" stop-color="#050a12"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2ee6c5"/>
      <stop offset="0.55" stop-color="#57b8ff"/>
      <stop offset="1" stop-color="#7c5cff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2ee6c5" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#2ee6c5" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="30"/></filter>
  </defs>

  <rect width="640" height="400" fill="url(#bg)"/>
  <ellipse cx="320" cy="200" rx="330" ry="150" fill="url(#glow)" filter="url(#soft)"/>

  <!-- concentric "live room" rings -->
  <g fill="none" stroke="#2ee6c5" opacity="0.14">
    <circle cx="320" cy="200" r="90"/>
    <circle cx="320" cy="200" r="130"/>
    <circle cx="320" cy="200" r="172"/>
    <circle cx="320" cy="200" r="214"/>
  </g>

  <!-- waveform bars -->
  <g fill="url(#bar)">
    <rect x="92" y="184" width="6" height="32" rx="3" opacity="0.7"/>
    <rect x="106" y="164" width="6" height="72" rx="3" opacity="0.8"/>
    <rect x="120" y="140" width="6" height="120" rx="3"/>
    <rect x="134" y="172" width="6" height="56" rx="3" opacity="0.75"/>
    <rect x="148" y="120" width="6" height="160" rx="3"/>
    <rect x="162" y="150" width="6" height="100" rx="3" opacity="0.9"/>
    <rect x="176" y="176" width="6" height="48" rx="3" opacity="0.7"/>
    <rect x="190" y="134" width="6" height="132" rx="3"/>
    <rect x="204" y="96" width="6" height="208" rx="3"/>
    <rect x="218" y="158" width="6" height="84" rx="3" opacity="0.85"/>
    <rect x="232" y="122" width="6" height="156" rx="3"/>
    <rect x="246" y="170" width="6" height="60" rx="3" opacity="0.7"/>
    <rect x="260" y="104" width="6" height="192" rx="3"/>
    <rect x="274" y="146" width="6" height="108" rx="3" opacity="0.9"/>
    <rect x="288" y="78" width="6" height="244" rx="3"/>
    <rect x="302" y="130" width="6" height="140" rx="3"/>
    <rect x="316" y="158" width="6" height="84" rx="3" opacity="0.8"/>
    <rect x="330" y="92" width="6" height="216" rx="3"/>
    <rect x="344" y="142" width="6" height="116" rx="3" opacity="0.9"/>
    <rect x="358" y="110" width="6" height="180" rx="3"/>
    <rect x="372" y="164" width="6" height="72" rx="3" opacity="0.72"/>
    <rect x="386" y="128" width="6" height="144" rx="3"/>
    <rect x="400" y="152" width="6" height="96" rx="3" opacity="0.85"/>
    <rect x="414" y="118" width="6" height="164" rx="3"/>
    <rect x="428" y="174" width="6" height="52" rx="3" opacity="0.7"/>
    <rect x="442" y="140" width="6" height="120" rx="3"/>
    <rect x="456" y="166" width="6" height="68" rx="3" opacity="0.8"/>
    <rect x="470" y="150" width="6" height="100" rx="3"/>
    <rect x="484" y="180" width="6" height="40" rx="3" opacity="0.65"/>
    <rect x="498" y="160" width="6" height="80" rx="3" opacity="0.8"/>
    <rect x="512" y="184" width="6" height="32" rx="3" opacity="0.6"/>
    <rect x="526" y="170" width="6" height="60" rx="3" opacity="0.7"/>
  </g>

  <!-- speaker focus -->
  <circle cx="320" cy="200" r="26" fill="#050a12" stroke="url(#bar)" stroke-width="2"/>
  <circle cx="320" cy="200" r="6" fill="#2ee6c5"/>

  <g transform="translate(40 36)">
    <rect width="96" height="26" rx="13" fill="#0a141a" stroke="#2ee6c5" stroke-opacity="0.3"/>
    <circle cx="14" cy="13" r="4" fill="#2ee6c5"/>
    <text x="26" y="17" font-family="Inter, Helvetica, Arial, sans-serif" font-size="9" fill="#9fe8dc" letter-spacing="1.4">LIVE</text>
  </g>
  <text x="40" y="372" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" fill="#5f8c94" letter-spacing="3.2">SPATIAL AUDIO · CRYSTAL CLEAR · FREE</text>
</svg>
