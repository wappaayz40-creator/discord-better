name: Deploy Fleek to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      reason:
        description: "What are you deploying?"
        required: false
        default: "manual deploy"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node build.mjs
      - name: Create D1 and point Wrangler at it
        id: prepare
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          node scripts/prepare-cloudflare.mjs 2>&1 | tee /tmp/prepare.log
      - name: Show setup failure
        if: steps.prepare.outcome == 'failure'
        run: |
          {
            echo "### Cloudflare setup failed"
            echo '```'
            tail -40 /tmp/prepare.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          msg=$(tail -c 900 /tmp/prepare.log | tr '\n' ' ' | sed 's/%/%25/g; s/\r//g')
          echo "::error title=Cloudflare setup failed::$msg"
          exit 1
      - name: Deploy Worker
        id: deploy
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          npx wrangler deploy 2>&1 | tee /tmp/deploy.log
          url=$(perl -pe 's/\e\[[0-9;]*m//g' /tmp/deploy.log | grep -oE 'https://[^[:space:]]+\.workers\.dev' | head -1 || true)
          if [ -n "$url" ]; then
            echo "::notice title=Worker URL::$url"
            echo "Deployed to $url" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Show deploy failure
        if: steps.deploy.outcome == 'failure'
        run: |
          msg=$(tail -c 900 /tmp/deploy.log | perl -pe 's/\e\[[0-9;]*m//g' | tr '\n' ' ' | sed 's/%/%25/g; s/\r//g')
          echo "::error title=Cloudflare deploy failed::$msg"
          exit 1
