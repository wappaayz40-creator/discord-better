name: Deploy Fleek to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      reason:
        description: "What are you deploying?"
        required: false
        default: "manual deploy"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node build.mjs
      - name: Create D1 + R2 and point Wrangler at them
        id: prepare
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          node scripts/prepare-cloudflare.mjs 2>&1 | tee /tmp/prepare.log
      - name: Show setup failure
        if: steps.prepare.outcome == 'failure'
        run: |
          {
            echo "### Cloudflare setup failed"
            echo '```'
            tail -40 /tmp/prepare.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
