name: Deploy landing to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Set Pages source to GitHub Actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          code=$(curl -sS -o /tmp/pages.json -w '%{http_code}' -X PUT             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/${{ github.repository }}/pages"             -d '{"build_type":"workflow"}')
          echo "GitHub Pages update HTTP $code"
          if [ "$code" -ge 300 ]; then cat /tmp/pages.json; exit 1; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
